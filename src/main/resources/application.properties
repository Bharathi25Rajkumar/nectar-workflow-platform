spring.application.name=nectar-workflow-platform
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=ThisIsAVeryLongSecretKeyForJWTSigningAtLeast32Chars123456
app.jwt.expiration-ms=86400000

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
nectar.kafka.topics.workflow-events=nectar.workflow.events
nectar.kafka.topics.task-events=nectar.task.events

#producer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

#consumer
spring.kafka.consumer.group-id=nectar-audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

nectar.rabbitmq.exchange=nectar.exchange
nectar.rabbitmq.queues.task=nectar.task.queue
nectar.rabbitmq.queues.task-dlq=nectar.task.dlq
nectar.rabbitmq.routing-keys.task=task.event
nectar.rabbitmq.routing-keys.task-dlq=task.dlq

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
