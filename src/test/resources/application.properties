spring.datasource.url=jdbc:h2:mem:nectar_test;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.h2.console.enabled=false
spring.jpa.show-sql=false
app.jwt.secret=ThisIsAVeryLongSecretKeyForJWTSigningAtLeast32Chars123456
app.jwt.expiration-ms=86400000
spring.kafka.bootstrap-servers=localhost:9092
nectar.kafka.topics.workflow-events=nectar.workflow.events
nectar.kafka.topics.task-events=nectar.task.events
spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=nectar-audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.rabbitmq.host=localhost
spring.rabbitmq.listener.simple.auto-startup=false
